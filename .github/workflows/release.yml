name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod

      - name: Build
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir dist
          for arch in amd64 arm64; do
            name="d2rinfo-${GITHUB_REF_NAME}-linux-${arch}"
            mkdir "dist/${name}"
            GOOS=linux GOARCH="${arch}" go build -trimpath -ldflags "-s -w" -o "dist/${name}/d2rinfo" .
            cp LICENSE README.md d2rinfo.service "dist/${name}/"
            tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          done
          cd dist && sha256sum *.tar.gz > SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" --generate-notes dist/*.tar.gz dist/SHA256SUMS
